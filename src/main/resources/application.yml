spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/newsdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true
  #h2.console.enabled: true
